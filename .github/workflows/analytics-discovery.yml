name: Discover existing Google Analytics configuration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: commercelint-analytics-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect the existing public Unsubscriber web bundle
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          start = "https://unsubscriber.me/"
          ua = "CommerceLint-Analytics-Discovery/1.0"
          measurement_pattern = re.compile(r"\bG-[A-Z0-9]{6,20}\b")
          firebase_pattern = re.compile(r"measurementId[\\\"'\s:=]+(G-[A-Z0-9]{6,20})")
          script_pattern = re.compile(r"<script[^>]+src=[\"']([^\"']+)[\"']", re.I)

          def fetch(url: str, limit: int = 4_000_000) -> tuple[int, str]:
              request = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "text/html,application/javascript,*/*"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return int(response.status), response.read(limit).decode("utf-8", errors="replace")

          checked: list[dict[str, object]] = []
          findings: dict[str, set[str]] = {}
          errors: list[str] = []
          try:
              status, html = fetch(start)
              checked.append({"url": start, "status": status, "bytes": len(html)})
              candidates = [start]
              for raw in script_pattern.findall(html):
                  url = urllib.parse.urljoin(start, raw)
                  if urllib.parse.urlparse(url).hostname == "unsubscriber.me":
                      candidates.append(url)
              # Include Next.js build manifests when present; these can reference lazy chunks.
              for raw in re.findall(r"[\"']([^\"']*(?:_buildManifest|_ssgManifest)[^\"']*\.js)[\"']", html):
                  candidates.append(urllib.parse.urljoin(start, raw))

              seen: set[str] = set()
              queue = list(dict.fromkeys(candidates))[:80]
              for url in queue:
                  if url in seen:
                      continue
                  seen.add(url)
                  try:
                      status, body = fetch(url)
                      checked.append({"url": url, "status": status, "bytes": len(body)})
                      ids = set(measurement_pattern.findall(body)) | set(firebase_pattern.findall(body))
                      if ids:
                          findings[url] = ids
                      # Discover same-host JavaScript chunks referenced by fetched JS/manifests.
                      if len(seen) < 120:
                          for raw in re.findall(r"[\"']([^\"']+\.js(?:\?[^\"']*)?)[\"']", body):
                              child = urllib.parse.urljoin(url, raw)
                              if urllib.parse.urlparse(child).hostname == "unsubscriber.me" and child not in seen and child not in queue:
                                  queue.append(child)
                                  if len(queue) >= 120:
                                      break
                  except Exception as exc:
                      errors.append(f"{url}: {type(exc).__name__}: {exc}")
                  time.sleep(0.05)
          except Exception as exc:
              errors.append(f"{start}: {type(exc).__name__}: {exc}")

          ids = sorted({value for values in findings.values() for value in values})
          payload = {
              "schema_version": 1,
              "generated_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "source": start,
              "status": "found" if ids else "not_found",
              "measurement_ids": ids,
              "finding_sources": {url: sorted(values) for url, values in findings.items()},
              "checked_resources": checked,
              "errors": errors,
              "note": "GA4 measurement IDs are public configuration identifiers, not authentication secrets. No private credentials were accessed.",
          }
          path = Path("state/analytics_discovery.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": payload["status"], "measurement_ids": ids, "checked": len(checked), "errors": len(errors)}))
          PY

      - name: Commit discovery evidence
        shell: bash
        run: |
          git config user.name "commercelint-analytics[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add state/analytics_discovery.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "analytics: inspect existing public GA configuration"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Open an incident only when discovery execution fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[CommerceLint] Analytics discovery failed"
          body="The one-time public analytics configuration discovery failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
