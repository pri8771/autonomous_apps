name: Complete consent-gated CommerceLint analytics migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-analytics-v2.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: commercelint-state-writers
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply, validate, and persist analytics instrumentation
        id: migration
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "commercelint-analytics[bot]"
          git config user.email "pchordia@unsubscriber.me"
          result=1
          detail="migration did not start"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            set +e
            python operator/analytics_migration_v2.py
            migration_code=$?
            node --check docs/assets/analytics.js
            javascript_code=$?
            python -m py_compile operator/main.py operator/analytics_migration_v2.py
            python_code=$?
            python -m json.tool config/business.json >/dev/null
            config_code=$?
            python -m json.tool state/state.json >/dev/null
            state_code=$?
            set -e

            if [ "$migration_code" -ne 0 ] || [ "$javascript_code" -ne 0 ] || [ "$python_code" -ne 0 ] || [ "$config_code" -ne 0 ] || [ "$state_code" -ne 0 ]; then
              detail="migration=${migration_code}, javascript=${javascript_code}, python=${python_code}, config=${config_code}, state=${state_code}"
              break
            fi

            rm -f \
              .github/workflows/enable-analytics.yml \
              .github/workflows/enable-analytics-v2.yml \
              .github/workflows/analytics-discovery.yml \
              operator/analytics_migration_v2.py

            git add -A
            if git diff --cached --quiet; then
              result=0
              detail="analytics migration already current"
              break
            fi

            git commit -m "Enable verified consent-gated CommerceLint analytics"
            if git push origin HEAD:main; then
              result=0
              detail="analytics migration committed"
              break
            fi

            detail="push conflict on attempt ${attempt}; retrying from latest main"
            sleep $((attempt * 3))
          done

          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Dispatch an immediate operator cycle
        if: ${{ steps.migration.outputs.result == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly-operator.yml --ref main

      - name: Resolve analytics migration incidents
        if: ${{ steps.migration.outputs.result == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for title in "[CommerceLint] Analytics source migration failed" "[CommerceLint] Analytics migration failed"; do
            issue="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "The consent-gated analytics migration completed and passed source validation at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Closing automatically."
              gh issue close "$issue" --reason completed
            fi
          done

      - name: Open or refresh an analytics migration incident
        if: ${{ steps.migration.outputs.result != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.migration.outputs.detail }}
        shell: bash
        run: |
          title="[CommerceLint] Analytics migration failed"
          body="The robust analytics migration failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). ${DETAIL}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Fail after incident recording
        if: ${{ steps.migration.outputs.result != '0' }}
        run: exit 1
