name: MachineCart IndexNow notifier

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.html"
      - "docs/sitemap.xml"
      - "docs/*.txt"
      - "operator/indexnow.py"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: machinecart-indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out changed site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate notifier
        run: python -m py_compile operator/indexnow.py

      - name: Select changed public URLs and notify IndexNow
        id: indexnow
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD -- 'docs/**/*.html' 'docs/*.html' 'docs/sitemap.xml' 'docs/*.txt')
          else
            changed=()
          fi

          if [ "${#changed[@]}" -eq 0 ]; then
            python operator/indexnow.py --all
          else
            python operator/indexnow.py "${changed[@]}"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit durable submission evidence
        shell: bash
        run: |
          git config user.name "machinecart-indexnow[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add state/indexnow_state.json
          if git diff --cached --quiet; then
            echo "No new IndexNow evidence to commit."
            exit 0
          fi
          git commit -m "distribution: record IndexNow submission $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Open or refresh an incident after a rejected submission
        if: steps.indexnow.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] IndexNow submission incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="IndexNow rejected or could not verify the latest MachineCart URL submission at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review state/indexnow_state.json. The next changed-content push will retry."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resolve a stale incident after recovery
        if: steps.indexnow.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'in:title [MachineCart] IndexNow submission incident' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "IndexNow accepted the latest URL batch at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Closing automatically."
            gh issue close "$existing" --reason completed
          fi
