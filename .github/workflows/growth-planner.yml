name: MachineCart Growth Planner

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "operator/growth_planner.py"
      - "operator/content_expander.py"
      - ".github/workflows/growth-planner.yml"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: machinecart-growth-planner
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out durable business state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade planner to preserve the live commercial funnel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("operator/growth_planner.py")
          text = path.read_text(encoding="utf-8")

          function_marker = "def validate_sales_pages() -> None:"
          if function_marker not in text:
              insertion_marker = "\ndef replace_once(path: Path, old: str, new: str) -> bool:\n"
              if text.count(insertion_marker) != 1:
                  raise SystemExit(
                      f"Expected one replace_once marker; found {text.count(insertion_marker)}"
                  )
              function = '''

def validate_sales_pages() -> None:
    """Refuse to run if a maintained conversion asset has regressed."""

    requirements = {
        DOCS / "founding-audit.html": (
            "auditRequestForm",
            "contactEmail",
            "storeUrl",
            "audit-request-composed",
        ),
        DOCS / "agency.html": (
            "downloads/machinecart-audit-backlog.csv",
            "downloads/machinecart-audit-report-template.md",
        ),
        DOCS / "sample-audit.html": (
            "Sample MachineCart audit",
            "founding-audit.html",
        ),
        DOCS / "methodology.html": (
            "How MachineCart audits a store",
            "founding-audit.html",
        ),
        DOCS / "service.json": (
            '"paid_service"',
            '"price": 49',
        ),
        DOCS / "llms.txt": (
            "MachineCart",
            "Founding audit",
        ),
    }
    failures = []
    for asset, markers in requirements.items():
        if not asset.exists():
            failures.append(f"{asset.relative_to(ROOT)}: missing")
            continue
        content = asset.read_text(encoding="utf-8")
        missing = [marker for marker in markers if marker not in content]
        if missing:
            failures.append(
                f"{asset.relative_to(ROOT)}: missing required markers {missing}"
            )
    if failures:
        raise RuntimeError("Commercial funnel regression: " + "; ".join(failures))
'''
              text = text.replace(insertion_marker, function + insertion_marker, 1)

          legacy_call = "    write_sales_pages()\n"
          safe_call = "    validate_sales_pages()\n"
          if safe_call not in text:
              if text.count(legacy_call) != 1:
                  raise SystemExit(
                      f"Expected one legacy sales-page rewrite call; found {text.count(legacy_call)}"
                  )
              text = text.replace(legacy_call, safe_call, 1)

          old_dependencies = '''    growth["next_external_dependencies"] = [
        "Canonical production hosting or GitHub Pages activation",
        "Owner-verified payment checkout",
        "One authenticated social publishing channel",
        "First-party analytics endpoint",
    ]'''
          new_dependencies = '''    growth["next_external_dependencies"] = [
        "Owner-verified payment checkout",
        "One authenticated social publishing channel",
        "Analytics read access for automated optimization",
    ]'''
          if new_dependencies not in text and old_dependencies in text:
              text = text.replace(old_dependencies, new_dependencies, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate planner syntax
        run: python -m py_compile operator/growth_planner.py operator/content_expander.py

      - name: Replenish growth backlog and validate funnel
        run: |
          python operator/growth_planner.py
          python operator/content_expander.py

      - name: Commit planner output
        shell: bash
        run: |
          git config user.name "machinecart-growth[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add content/queue.json state/growth_state.json state/catalog_state.json docs/index.html docs/scanner.html docs/sample-audit.html docs/founding-audit.html docs/agency.html docs/methodology.html docs/service.json docs/llms.txt docs/downloads operator/main.py operator/growth_planner.py
          if git diff --cached --quiet; then
            echo "No growth-plan changes to commit."
          else
            git commit -m "growth: extend ninety-day acquisition runway $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Push attempt $attempt failed; rebasing and retrying."
              git pull --rebase origin main
              sleep $((attempt * 3))
            done
          fi

      - name: Hand the current plan to the hourly operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly-operator.yml --ref main

      - name: Open planner incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] Growth planner incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="The growth planner failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review the current workflow job before the next scheduled cycle."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
