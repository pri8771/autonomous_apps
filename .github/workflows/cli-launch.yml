name: Launch CommerceLint CLI and GitHub Action

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli-launch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commercelint-state-writers
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest durable state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tested developer tool bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import zipfile
          from pathlib import Path

          payload = (
          ""
          ""
          ""
          ""
          ""
          )
          raw = base64.b64decode(payload)
          expected = "0a512c04c16d361df9fdf0914375da199df56beafbb55abb807833b06dcdb6d4"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"Bundle checksum mismatch: {actual}")

          archive = zipfile.ZipFile(io.BytesIO(raw))
          for member in archive.infolist():
              path = Path(member.filename)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe archive member: {member.filename}")
              target = Path(member.filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(member))
          PY

      - name: Prove the CLI and failure policies
        shell: bash
        run: |
          python -m py_compile cli/commercelint.py
          python -m unittest discover -s tests -v
          python cli/commercelint.py tests/fixtures/strong.html \
            --format markdown \
            --output /tmp/strong-report.md \
            --min-score 90 \
            --fail-on fail
          if python cli/commercelint.py tests/fixtures/missing-offer.html --fail-on fail --format text; then
            echo "The intentionally incomplete fixture should have failed." >&2
            exit 1
          fi
          grep -q "CommerceLint Product-Page Field Linter" action.yml
          grep -q "Need accuracy checks rather than field coverage" docs/cli.html

      - name: Commit the developer tool and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "commercelint-product[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git rm .github/workflows/cli-launch.yml
          git add cli tests action.yml .github/workflows/cli-test.yml docs/cli.html
          git commit -m "Launch CommerceLint CLI and GitHub Action"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
