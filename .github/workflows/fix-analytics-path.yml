name: Fix CommerceLint analytics path

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-analytics-path.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct generated status path
        run: |
          python - <<'PY'
          from pathlib import Path
          operator = Path('operator/main.py')
          text = operator.read_text(encoding='utf-8')
          anchor = "    status_page = status_page.replace('href=\"../assets/site.css\"', 'href=\"assets/site.css\"')\n"
          addition = "    status_page = status_page.replace('src=\"../assets/analytics.js\"', 'src=\"assets/analytics.js\"')\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('status normalization anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          operator.write_text(text, encoding='utf-8')

          status = Path('docs/status.html')
          value = status.read_text(encoding='utf-8').replace('src="../assets/analytics.js"', 'src="assets/analytics.js"')
          status.write_text(value, encoding='utf-8')
          PY
          python -m py_compile operator/main.py
          grep -q 'src="assets/analytics.js"' docs/status.html
      - name: Commit repair
        run: |
          rm .github/workflows/fix-analytics-path.yml
          git config user.name "commercelint-analytics[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add operator/main.py docs/status.html .github/workflows/fix-analytics-path.yml
          git commit -m "Fix generated CommerceLint analytics path"
          git push origin HEAD:main
