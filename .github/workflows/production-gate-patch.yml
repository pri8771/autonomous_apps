name: Apply MachineCart canonical production gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-gate-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machinecart-production-gate-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current operator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent production corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("operator/main.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'canonical = f"https://pri8771.github.io/autonomous_apps/{canonical_path.lstrip(\'/\')}" if canonical_path else ""',
                  'canonical = f"https://priyanshchordia.com/machinecart/{canonical_path.lstrip(\'/\')}" if canonical_path else ""',
              ),
              (
                  "update_burn_in(state, now, run_ok, public_ok, local_ok, config)",
                  "update_burn_in(state, now, run_ok, canonical_ok, local_ok, config)",
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched operator
        run: python -m py_compile operator/main.py

      - name: Commit production gate
        shell: bash
        run: |
          git config user.name "machinecart-maintenance[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add operator/main.py
          if git diff --cached --quiet; then
            echo "Production gate already applied."
            exit 0
          fi
          git commit -m "Require canonical production health for burn-in"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
