name: CommerceLint Hourly Operator

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "config/**"
      - "content/queue.json"
      - "docs/index.html"
      - "docs/scanner.html"
      - "docs/cli.html"
      - "docs/founding-audit.html"
      - "docs/privacy.html"
      - "docs/assets/**"
      - ".github/workflows/hourly-operator.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: commercelint-state-writers
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - name: Check out durable business state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one bounded cycle and persist from the latest state
        id: operator
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "commercelint-operator[bot]"
          git config user.email "pchordia@unsubscriber.me"

          operator_code=1
          persist_code=1
          detail="cycle did not start"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if ! python operator/conversion_migration.py; then
              operator_code=1
              detail="conversion migration failed"
              break
            fi
            if ! python operator/cli_migration.py; then
              operator_code=1
              detail="CLI verification or publication migration failed"
              break
            fi
            if ! python operator/funnel_guard.py; then
              operator_code=1
              detail="commercial funnel guard failed"
              break
            fi
            if ! python operator/github_lead_funnel.py; then
              operator_code=1
              detail="GitHub lead-funnel guard failed"
              break
            fi

            set +e
            python operator/main.py
            operator_code=$?
            set -e
            detail="operator exit code ${operator_code}"

            git add \
              state \
              content/queue.json \
              docs \
              operator/main.py \
              README.md \
              STATE.json \
              DECISIONS.md \
              CHANGELOG.md \
              .github/workflows/indexnow.yml
            if git diff --cached --quiet; then
              persist_code=0
              break
            fi

            git commit -m "operator: hourly cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if git push origin HEAD:main; then
              persist_code=0
              break
            fi

            detail="push conflict on attempt ${attempt}; rerunning from latest state"
            sleep $((attempt * 3))
          done

          {
            echo "exit_code=${operator_code}"
            echo "persist_code=${persist_code}"
            echo "detail=${detail}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or refresh an operator incident
        if: ${{ always() && (steps.operator.outputs.exit_code != '0' || steps.operator.outputs.persist_code != '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.operator.outputs.exit_code }}
          PERSIST_CODE: ${{ steps.operator.outputs.persist_code }}
          DETAIL: ${{ steps.operator.outputs.detail }}
        shell: bash
        run: |
          title="[CommerceLint] Operator incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="The hourly operator did not complete cleanly at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Operator exit: ${EXIT_CODE}; persistence exit: ${PERSIST_CODE}; detail: ${DETAIL}. The watchdog will dispatch recovery."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resolve a stale operator incident
        if: ${{ steps.operator.outputs.exit_code == '0' && steps.operator.outputs.persist_code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'in:title [CommerceLint] Operator incident' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The operator completed and persisted successfully at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Closing automatically."
            gh issue close "$existing" --reason completed
          fi

      - name: Fail the workflow after incident recording
        if: ${{ always() && (steps.operator.outputs.exit_code != '0' || steps.operator.outputs.persist_code != '0') }}
        run: exit 1

  botchorus:
    name: BotChorus cloud heartbeat
    needs: operate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: botchorus-state-writers
      cancel-in-progress: false
    env:
      BOTCHORUS_RUN_ID: ${{ github.run_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the latest durable state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap or run BotChorus and persist verified state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "botchorus-operator[bot]"
          git config user.email "13511421+pri8771@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if [ -f projects/botchorus-bootstrap.py ]; then
              python3 projects/botchorus-bootstrap.py
            elif [ -f projects/botchorus/operator.py ]; then
              BOTCHORUS_RUN_KIND="hourly_cloud_fallback" python3 projects/botchorus/operator.py
              python3 projects/botchorus/operator.py --check
              python3 -m unittest discover -s projects/botchorus/tests -p 'test_*.py'
            else
              echo "BotChorus source is not present; no action required."
              exit 0
            fi

            git add -A .github/workflows .github/ISSUE_TEMPLATE projects
            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "BotChorus cloud heartbeat $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "BotChorus push conflict on attempt ${attempt}; regenerating from latest state."
            sleep $((attempt * 2))
          done

          exit 1
