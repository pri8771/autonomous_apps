name: CommerceLint Watchdog

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/watchdog.yml"
      - "config/business.json"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: commercelint-state-writers
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect heartbeat
        id: heartbeat
        run: python operator/watchdog.py evaluate

      - name: Dispatch recovery
        id: recovery
        if: ${{ steps.heartbeat.outputs.stale == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly-operator.yml --ref main

      - name: Persist watchdog diary
        id: diary
        if: always()
        env:
          STALE: ${{ steps.heartbeat.outputs.stale }}
          AGE: ${{ steps.heartbeat.outputs.age_minutes }}
          THRESHOLD: ${{ steps.heartbeat.outputs.threshold_minutes }}
          REASON: ${{ steps.heartbeat.outputs.reason }}
          STARTED_AT_UTC: ${{ steps.heartbeat.outputs.started_at_utc }}
          LAST_SUCCESS_AT_UTC: ${{ steps.heartbeat.outputs.last_success_at_utc }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "commercelint-watchdog[bot]"
          git config user.email "pchordia@unsubscriber.me"
          stale_value="${STALE:-true}"
          age_value="${AGE:-999999}"
          threshold_value="${THRESHOLD:-0}"
          reason_value="${REASON:-heartbeat evaluation failed before producing a reason}"
          started_value="${STARTED_AT_UTC:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if ! python operator/watchdog.py record \
              --stale "$stale_value" \
              --age-minutes "$age_value" \
              --threshold-minutes "$threshold_value" \
              --reason "$reason_value" \
              --started-at-utc "$started_value" \
              --last-success-at-utc "$LAST_SUCCESS_AT_UTC" \
              --recovery-outcome "$RECOVERY_OUTCOME"; then
              echo "The diary records a failed recovery dispatch; persistence will continue before the workflow fails."
            fi

            git add state/audit state/watchdog.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "watchdog: record heartbeat check $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Open or refresh a stale-heartbeat incident
        if: ${{ always() && steps.heartbeat.outputs.stale == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGE: ${{ steps.heartbeat.outputs.age_minutes }}
          THRESHOLD: ${{ steps.heartbeat.outputs.threshold_minutes }}
          REASON: ${{ steps.heartbeat.outputs.reason }}
        shell: bash
        run: |
          title="[CommerceLint] Stale heartbeat"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="The watchdog detected: ${REASON}. The last successful heartbeat was ${AGE} minutes old; the configured threshold is ${THRESHOLD} minutes. A recovery cycle was dispatched at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resolve a stale-heartbeat incident
        if: ${{ always() && steps.heartbeat.outputs.stale == 'false' && steps.diary.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'in:title [CommerceLint] Stale heartbeat' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The CommerceLint heartbeat is healthy again. Closing automatically."
            gh issue close "$existing" --reason completed
          fi

      - name: Fail after recovery or diary failure is recorded
        if: ${{ always() && (steps.diary.outcome == 'failure' || (steps.heartbeat.outputs.stale == 'true' && steps.recovery.outcome != 'success')) }}
        run: exit 1
