name: MachineCart Hourly Operator

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "config/**"
      - "content/queue.json"
      - "docs/index.html"
      - "docs/scanner.html"
      - "docs/founding-audit.html"
      - "docs/privacy.html"
      - "docs/assets/**"
      - ".github/workflows/hourly-operator.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: machinecart-hourly-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - name: Check out durable business state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply idempotent conversion migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path("docs/scanner.html")
          scanner = scanner_path.read_text(encoding="utf-8")
          destination_marker = "founding-audit.html?${auditParams.toString()}#request"
          if destination_marker not in scanner:
              start_marker = "    const subject = encodeURIComponent(`MachineCart deep audit"
              end_marker = "    $('auditButton').href = `mailto:pchordia@unsubscriber.me?subject=${subject}&body=${body}`;"
              start = scanner.find(start_marker)
              end_start = scanner.find(end_marker, start)
              if start < 0 or end_start < 0:
                  raise SystemExit("Could not locate the legacy scanner audit handoff")
              end = end_start + len(end_marker)
              replacement = """    const auditParams = new URLSearchParams({
      source: 'scanner',
      score: String(report.score),
      failed: String(report.counts.fail),
      warnings: String(report.counts.warning),
      pageTitle: report.page.title || 'Product page'
    });
    if (report.source.url) auditParams.set('storeUrl', report.source.url);
    const acquisition = new URLSearchParams(window.location.search);
    for (const key of ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']) {
      const value = acquisition.get(key);
      if (value) auditParams.set(key, value);
    }
    $('auditButton').href = `founding-audit.html?${auditParams.toString()}#request`;"""
              scanner = scanner[:start] + replacement + scanner[end:]
              scanner_path.write_text(scanner, encoding="utf-8")

          form_path = Path("docs/founding-audit.html")
          form = form_path.read_text(encoding="utf-8")
          if "const params = new URLSearchParams(window.location.search);" not in form:
              marker = """    const form = document.getElementById('auditRequestForm');
    const status = document.getElementById('requestStatus');
    form.addEventListener('submit', event => {"""
              replacement = """    const form = document.getElementById('auditRequestForm');
    const status = document.getElementById('requestStatus');
    const params = new URLSearchParams(window.location.search);
    const scannedUrl = params.get('storeUrl');
    if (scannedUrl) document.getElementById('storeUrl').value = scannedUrl;
    const scanContext = [
      params.get('score') ? `Scanner score: ${params.get('score')}` : '',
      params.get('failed') ? `Failed checks: ${params.get('failed')}` : '',
      params.get('warnings') ? `Warnings: ${params.get('warnings')}` : '',
      params.get('pageTitle') ? `Scanned page: ${params.get('pageTitle')}` : ''
    ].filter(Boolean).join('\\n');
    if (scanContext) document.getElementById('details').value = scanContext;

    form.addEventListener('submit', event => {"""
              if marker not in form:
                  raise SystemExit("Could not locate the audit form initialization")
              form = form.replace(marker, replacement, 1)

          if "`Acquisition source: ${params.get('source') || 'direct'}`," not in form:
              marker = "        `Desired timing: ${data.get('urgency')}`,"
              addition = """
        `Acquisition source: ${params.get('source') || 'direct'}`,
        `UTM source: ${params.get('utm_source') || 'not supplied'}`,
        `UTM medium: ${params.get('utm_medium') || 'not supplied'}`,
        `UTM campaign: ${params.get('utm_campaign') || 'not supplied'}`,
        `Referrer: ${document.referrer || 'not supplied'}`,"""
              if marker not in form:
                  raise SystemExit("Could not locate the audit request timing field")
              form = form.replace(marker, marker + addition, 1)

          form_path.write_text(form, encoding="utf-8")
          PY

          grep -q "founding-audit.html?" docs/scanner.html
          grep -q "Scanner score:" docs/founding-audit.html
          grep -q "UTM campaign:" docs/founding-audit.html

      - name: Run bounded hourly operating cycle
        id: operator
        shell: bash
        run: |
          set +e
          python operator/main.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit durable state and generated assets
        shell: bash
        run: |
          git config user.name "machinecart-operator[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add state content/queue.json docs/status.json docs/status.html docs/guides docs/sitemap.xml docs/scanner.html docs/founding-audit.html
          if git diff --cached --quiet; then
            echo "No durable changes to commit."
            exit 0
          fi
          git commit -m "operator: hourly cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Open or refresh an incident if the cycle failed
        if: steps.operator.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.operator.outputs.exit_code }}
        shell: bash
        run: |
          title="[MachineCart] Operator incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="The hourly operator returned exit code ${EXIT_CODE} at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review the latest state/run log and workflow job. The watchdog will continue attempting recovery."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resolve stale incident after recovery
        if: steps.operator.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'in:title [MachineCart] Operator incident' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The operator completed successfully at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Closing the incident automatically."
            gh issue close "$existing" --reason completed
          fi
