name: Finalize CommerceLint CLI Publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: commercelint-cli-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and atomically publish from the latest branch state
        id: finalize
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "commercelint-product[bot]"
          git config user.email "pchordia@unsubscriber.me"

          persist_code=1
          detail="finalization did not start"

          for attempt in $(seq 1 8); do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            set +e
            python operator/cli_migration.py
            migration_code=$?
            set -e
            if [ "$migration_code" -ne 0 ]; then
              detail="CLI migration failed with exit code ${migration_code}"
              break
            fi

            python operator/funnel_guard.py
            python -m json.tool state/cli_launch.json >/dev/null
            grep -q 'verified_and_published' state/cli_launch.json
            grep -q 'href="cli.html">CI / CLI' docs/index.html
            grep -q '/commercelint/cli.html' docs/sitemap.xml
            grep -q '"developer_tool"' docs/service.json

            git add \
              state \
              docs \
              operator/main.py \
              README.md \
              STATE.json \
              DECISIONS.md \
              CHANGELOG.md \
              .github/workflows/indexnow.yml
            git rm .github/workflows/cli-finalize.yml

            git commit -m "Finalize verified CommerceLint CLI publication"
            if git push origin HEAD:main; then
              persist_code=0
              detail="verified CLI publication persisted"
              break
            fi

            detail="push conflict on attempt ${attempt}; rebuilding from latest state"
            sleep $((attempt * 4 + 3))
          done

          {
            echo "persist_code=${persist_code}"
            echo "detail=${detail}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or refresh finalization incident
        if: steps.finalize.outputs.persist_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.finalize.outputs.detail }}
        shell: bash
        run: |
          title="[CommerceLint] CLI publication finalization failed"
          issue="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="CommerceLint CLI finalization failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). ${DETAIL}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail after incident recording
        if: steps.finalize.outputs.persist_code != '0'
        run: exit 1
