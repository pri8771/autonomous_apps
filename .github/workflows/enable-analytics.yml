name: Enable consent-gated CommerceLint analytics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-analytics.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: commercelint-state-writers
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics instrumentation from the latest durable state
        id: migrate
        shell: bash
        run: |
          set -u -o pipefail
          git config user.name "commercelint-analytics[bot]"
          git config user.email "pchordia@unsubscriber.me"
          result=1
          detail="migration did not start"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            set +e
            python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('.')
          DOCS = ROOT / 'docs'
          ANALYTICS = DOCS / 'assets' / 'analytics.js'
          MEASUREMENT_ID = 'G-3TY7EMFMWM'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          if not ANALYTICS.is_file():
              raise SystemExit('docs/assets/analytics.js is missing')
          analytics = ANALYTICS.read_text(encoding='utf-8')
          required_analytics_markers = [
              MEASUREMENT_ID,
              'commercelint:analyticsConsent:v1',
              'window.commerceLintTrack = track',
              'send_page_view: false',
              'scanned URLs',
          ]
          missing = [marker for marker in required_analytics_markers if marker not in analytics]
          if missing:
              raise SystemExit('analytics.js is incomplete: ' + ', '.join(missing))

          denied_old = '''    writeConsent(value);
              removeConsentBanner();
              if (value === "granted") initializeAnalytics();'''
          denied_new = '''    writeConsent(value);
              removeConsentBanner();
              if (value === "granted") initializeAnalytics();
              else if (analyticsInitialized) {
                window.gtag("consent", "update", {
                  analytics_storage: "denied",
                  ad_storage: "denied",
                  ad_user_data: "denied",
                  ad_personalization: "denied",
                });
              }'''
          if denied_old in analytics:
              analytics = analytics.replace(denied_old, denied_new, 1)
              ANALYTICS.write_text(analytics, encoding='utf-8')
          elif denied_new not in analytics:
              raise SystemExit('Could not install immediate consent withdrawal handling')

          # Every public HTML document gets exactly one correctly relative analytics loader.
          script_pattern = re.compile(
              r'\s*<script\b[^>]*\bsrc=["\'][^"\']*assets/analytics\.js["\'][^>]*>\s*</script>',
              re.IGNORECASE,
          )
          for path in sorted(DOCS.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              text = script_pattern.sub('', text)
              relative = os.path.relpath(ANALYTICS, path.parent).replace(os.sep, '/')
              tag = f'  <script defer src="{relative}"></script>\n'
              if '</head>' not in text:
                  raise SystemExit(f'{path}: missing closing head tag')
              text = text.replace('</head>', tag + '</head>', 1)
              path.write_text(text, encoding='utf-8')

          scanner_path = DOCS / 'scanner.html'
          scanner = scanner_path.read_text(encoding='utf-8')
          if "commerceLintTrack?.('scanner_start'" not in scanner:
              old = "  async function runScan() {\n    scannerCard.classList.add('loading');"
              new = "  async function runScan() {\n    window.commerceLintTrack?.('scanner_start', { scan_mode: mode });\n    scannerCard.classList.add('loading');"
              if old not in scanner:
                  raise SystemExit('scanner start insertion point was not found')
              scanner = scanner.replace(old, new, 1)

          if "commerceLintTrack?.('scanner_complete'" not in scanner:
              old = "      renderReport(analyzeMarkup(markup, source));\n      message.textContent = 'Analysis complete.';"
              new = """      const report = analyzeMarkup(markup, source);
              renderReport(report);
              const scoreBand = report.score >= 85 ? '85_100' : report.score >= 65 ? '65_84' : report.score >= 40 ? '40_64' : '0_39';
              const resultBand = report.score >= 85 ? 'strong' : report.score >= 65 ? 'repairable' : 'material_gaps';
              window.commerceLintTrack?.('scanner_complete', {
                scan_mode: mode,
                score_band: scoreBand,
                result_band: resultBand,
                missing_count: report.counts.fail,
                warning_count: report.counts.warning,
                pass_count: report.counts.pass
              });
              message.textContent = 'Analysis complete.';"""
              if old not in scanner:
                  raise SystemExit('scanner completion insertion point was not found')
              scanner = scanner.replace(old, new, 1)

          if "commerceLintTrack?.('scanner_error'" not in scanner:
              old = """    } catch (error) {
              message.textContent = `${error.message} Try “Paste HTML” for a reliable local scan.`;"""
              new = """    } catch (error) {
              const errorText = String(error && error.message || '');
              const errorCategory = /Paste at least|Enter a public product URL/.test(errorText)
                ? 'input_validation'
                : /Retrieval|HTTP|retrieved page|AbortError|fetch/i.test(errorText)
                  ? 'url_retrieval'
                  : 'analysis';
              window.commerceLintTrack?.('scanner_error', { scan_mode: mode, error_category: errorCategory });
              message.textContent = `${error.message} Try “Paste HTML” for a reliable local scan.`;"""
              if old not in scanner:
                  raise SystemExit('scanner error insertion point was not found')
              scanner = scanner.replace(old, new, 1)

          if "commerceLintTrack?.('evidence_download'" not in scanner:
              old = """  $('downloadButton').addEventListener('click', () => {
              if (!latestReport) return;"""
              new = """  $('downloadButton').addEventListener('click', () => {
              if (!latestReport) return;
              window.commerceLintTrack?.('evidence_download', { download_kind: 'scanner_json' });"""
              if old not in scanner:
                  raise SystemExit('download insertion point was not found')
              scanner = scanner.replace(old, new, 1)

          if "commerceLintTrack?.('example_loaded'" not in scanner:
              old = """  $('loadExample').addEventListener('click', () => {
              setMode('paste');"""
              new = """  $('loadExample').addEventListener('click', () => {
              window.commerceLintTrack?.('example_loaded', { source_surface: 'scanner' });
              setMode('paste');"""
              if old not in scanner:
                  raise SystemExit('example insertion point was not found')
              scanner = scanner.replace(old, new, 1)
          scanner_path.write_text(scanner, encoding='utf-8')

          privacy_path = DOCS / 'privacy.html'
          privacy = privacy_path.read_text(encoding='utf-8')
          analytics_section = '''<section><h2>Optional analytics</h2>
          <p>CommerceLint loads Google Analytics 4 only after you select <strong>Allow analytics</strong>. Before that choice, no Google Analytics script is requested and no analytics event is sent.</p>
          <p>When enabled, CommerceLint sends the sanitized page path without query strings, broad scanner outcome bands and counts, offer or CLI interest clicks, evidence-download events, and lead-start events. It does <strong>not</strong> send pasted HTML, scanned product URLs, titles from scanned stores, scan evidence, email addresses, or form contents.</p>
          <p>CommerceLint events use the <code>cl_</code> prefix and are separated by the <code>priyanshchordia.com</code> hostname in an owner-controlled Google Analytics account. Advertising storage, Google signals, ad personalization, and ad-user-data consent remain disabled.</p>
          <p>Your preference is stored in this browser. Global Privacy Control or Do Not Track disables analytics. You may change the preference below at any time.</p>
          <div class="button-row"><button type="button" class="button" data-cl-consent="granted">Allow analytics</button><button type="button" class="button secondary" data-cl-consent="denied">Decline analytics</button></div>
          <p class="field-help">Google processes consented analytics data under its own privacy terms. CommerceLint uses the data to measure page paths, scanner completion, offer interest, and acquisition sources.</p></section>'''
          privacy, count = re.subn(
              r'<section><h2>(?:Analytics|Optional analytics)</h2>.*?</section>',
              analytics_section,
              privacy,
              count=1,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if count != 1:
              raise SystemExit('privacy analytics section was not found')
          privacy = privacy.replace('Last updated August 23, 2026.', 'Last updated August 24, 2026.')
          privacy_path.write_text(privacy, encoding='utf-8')

          config_path = ROOT / 'config' / 'business.json'
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['site'].update({
              'analytics_provider': 'google_analytics_4',
              'analytics_measurement_id': MEASUREMENT_ID,
              'analytics_mode': 'explicit_opt_in',
              'analytics_event_namespace': 'cl_',
              'analytics_hostname_dimension': 'priyanshchordia.com',
              'analytics_data_minimization': [
                  'strip query strings from page_location',
                  'never send pasted HTML or scan evidence',
                  'never send scanned URLs or scanned page titles',
                  'never send email addresses or form contents',
                  'disable advertising storage, Google signals, ad personalization, and ad user data',
              ],
          })
          config['site'].pop('analytics_exclusion_reason', None)
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          operator_path = ROOT / 'operator' / 'main.py'
          operator = operator_path.read_text(encoding='utf-8')
          analytics_required = '        DOCS / "assets" / "analytics.js",\n'
          required_anchor = '        DOCS / "privacy.html",\n'
          if analytics_required not in operator:
              if required_anchor not in operator:
                  raise SystemExit('operator local asset list insertion point missing')
              operator = operator.replace(required_anchor, required_anchor + analytics_required, 1)
          script_tag = '  <script defer src="../assets/analytics.js"></script>\n'
          if script_tag not in operator:
              anchor = '  <link rel="stylesheet" href="../assets/site.css">\n</head>'
              if anchor not in operator:
                  raise SystemExit('operator render_page analytics insertion point missing')
              operator = operator.replace(anchor, '  <link rel="stylesheet" href="../assets/site.css">\n' + script_tag + '</head>', 1)
          operator_path.write_text(operator, encoding='utf-8')

          state_path = ROOT / 'state' / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          for task in state.get('tasks', []):
              if task.get('id') == 'instrument-first-party-analytics':
                  task.update({
                      'title': 'Deploy consent-gated CommerceLint funnel analytics',
                      'type': 'analytics_deployment',
                      'status': 'running',
                      'owner_required': False,
                      'attempts': int(task.get('attempts', 0)) + 1,
                      'success_condition': 'Production loads GA4 only after explicit consent and records sanitized page, scanner, offer, CLI, download, and lead-start events',
                      'evidence': f'Source instrumentation prepared with {MEASUREMENT_ID}; production verification is pending.',
                      'last_attempt_at_utc': now,
                  })
                  break
          else:
              state.setdefault('tasks', []).append({
                  'id': 'instrument-first-party-analytics',
                  'title': 'Deploy consent-gated CommerceLint funnel analytics',
                  'type': 'analytics_deployment',
                  'status': 'running',
                  'priority': 94,
                  'impact': 10,
                  'urgency': 10,
                  'confidence': 0.9,
                  'effort': 2,
                  'attempts': 1,
                  'max_attempts': 3,
                  'owner_required': False,
                  'success_condition': 'Production loads GA4 only after explicit consent and records sanitized funnel events',
                  'evidence': f'Source instrumentation prepared with {MEASUREMENT_ID}; production verification is pending.',
                  'last_attempt_at_utc': now,
              })
          lesson_text = 'Consent-gated GA4 instrumentation was added with strict event allowlisting and query-string removal.'
          if not any(item.get('lesson') == lesson_text for item in state.get('lessons', [])):
              state.setdefault('lessons', []).append({
                  'at_utc': now,
                  'category': 'measurement',
                  'lesson': lesson_text,
                  'evidence': f'Measurement ID {MEASUREMENT_ID}; source HTML, privacy policy, scanner events, and generator updated.',
              })
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          simple_state_path = ROOT / 'STATE.json'
          if simple_state_path.exists():
              simple = json.loads(simple_state_path.read_text(encoding='utf-8'))
              simple['last_verified_action'] = 'Prepared explicit-opt-in GA4 instrumentation with sanitized CommerceLint funnel events and no scanned-content collection.'
              simple['next_action'] = 'Deploy the updated public bundle, independently verify consent gating, then use hostname-filtered analytics to prioritize acquisition and conversion work.'
              simple_state_path.write_text(json.dumps(simple, indent=2) + '\n', encoding='utf-8')

          decisions = ROOT / 'DECISIONS.md'
          heading = '## 2026-08-24 — Consent-gated funnel analytics'
          if decisions.exists() and heading not in decisions.read_text(encoding='utf-8'):
              with decisions.open('a', encoding='utf-8') as handle:
                  handle.write(f'''\n{heading}\n**Decision:** Use the owner-controlled GA4 measurement ID `{MEASUREMENT_ID}` for CommerceLint with explicit opt-in consent, hostname separation, a `cl_` event namespace, and a strict non-content event allowlist.\n\n**Data minimization:** Strip query strings; never send pasted HTML, scanned URLs, scanned page titles, evidence, email addresses, or form contents. Keep advertising storage, Google signals, ad personalization, and ad-user-data consent disabled.\n\n**Reason:** The business needs real acquisition and funnel evidence, while scanned commerce content can be sensitive and is unnecessary for aggregate decision-making.\n''')

          changelog = ROOT / 'CHANGELOG.md'
          change_heading = '## 2026-08-24 — Consent-gated analytics'
          if changelog.exists() and change_heading not in changelog.read_text(encoding='utf-8'):
              with changelog.open('a', encoding='utf-8') as handle:
                  handle.write(f'''\n{change_heading}\n- Added explicit-opt-in Google Analytics 4 using `{MEASUREMENT_ID}`.\n- Added sanitized page, scanner, offer, CLI, download, and lead-start events.\n- Added consent withdrawal and Global Privacy Control / Do Not Track handling.\n- Updated every public HTML page, scanner instrumentation, privacy disclosure, durable state, and future guide generation.\n''')

          # Validation: exactly one loader per public HTML document.
          failures = []
          for path in sorted(DOCS.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              count = len(re.findall(r'<script\b[^>]*src=["\'][^"\']*assets/analytics\.js["\']', text, re.I))
              if count != 1:
                  failures.append(f'{path}: analytics loader count={count}')
          if failures:
              raise SystemExit('; '.join(failures))
          if 'storeUrl' in analytics or 'pageTitle' in analytics:
              raise SystemExit('analytics.js must not contain scanner URL or title parameter names')
          PY
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              detail="migration script exit code ${code}"
              break
            fi

            if ! node --check docs/assets/analytics.js; then detail="analytics JavaScript syntax failed"; break; fi
            if ! python -m py_compile operator/main.py; then detail="operator syntax failed"; break; fi
            if ! python -m json.tool config/business.json >/dev/null; then detail="business config JSON failed"; break; fi
            if ! python -m json.tool state/state.json >/dev/null; then detail="durable state JSON failed"; break; fi

            rm -f .github/workflows/enable-analytics.yml .github/workflows/analytics-discovery.yml
            git add -A
            if git diff --cached --quiet; then
              result=0
              detail="analytics migration already applied"
              break
            fi
            git commit -m "Enable consent-gated CommerceLint analytics"
            if git push origin HEAD:main; then
              result=0
              detail="analytics source migration committed"
              break
            fi
            detail="push conflict on attempt ${attempt}; retrying from latest main"
            sleep $((attempt * 3))
          done

          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Dispatch the hourly operator after successful migration
        if: ${{ steps.migrate.outputs.result == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly-operator.yml --ref main

      - name: Open an analytics migration incident
        if: ${{ steps.migrate.outputs.result != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.migrate.outputs.detail }}
        run: |
          title="[CommerceLint] Analytics source migration failed"
          body="Consent-gated analytics source migration failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). ${DETAIL}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

      - name: Fail after recording the incident
        if: ${{ steps.migrate.outputs.result != '0' }}
        run: exit 1
