name: MachineCart Growth Planner

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "operator/growth_planner.py"
      - ".github/workflows/growth-planner.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: machinecart-growth-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out durable business state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate planner syntax
        run: python -m py_compile operator/growth_planner.py

      - name: Replenish growth backlog and maintain funnel
        run: python operator/growth_planner.py

      - name: Commit planner output
        shell: bash
        run: |
          git config user.name "machinecart-growth[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add content/queue.json state/growth_state.json docs/index.html docs/scanner.html docs/sample-audit.html docs/founding-audit.html docs/agency.html operator/main.py
          if git diff --cached --quiet; then
            echo "No growth-plan changes to commit."
            exit 0
          fi
          git commit -m "growth: replenish acquisition backlog $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Open planner incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] Growth planner incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          body="The growth planner failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review the current workflow job before the next scheduled cycle."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
